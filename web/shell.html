<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122331">
<title>$GODOT_PROJECT_NAME</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#122331;color:#fff}body{font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}#cover{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:24px;padding:24px;background:#122331;text-align:center}#cover[hidden]{display:none}.title{width:min(680px,88vw);height:auto;image-rendering:pixelated}.scene{width:min(600px,86vw);max-height:44vh;object-fit:contain;image-rendering:pixelated;border:3px solid #06111c}button{background:#e9b84f;color:#152536;border:3px solid #080e18;border-bottom-width:7px;padding:16px 44px;cursor:pointer;min-height:56px}button:active{transform:translateY(3px);border-bottom-width:4px}button:focus-visible{outline:3px solid #75e8e4;outline-offset:5px}button img{display:block;width:140px;height:28px}button:disabled{opacity:.55;cursor:wait}progress{width:min(380px,80vw);accent-color:#79e0db;height:14px}#message{margin:0;max-width:42em;line-height:1.6;font-size:14px}#message:empty{display:none}@media(max-height:550px){#cover{gap:14px}.scene{max-height:28vh}.title{max-height:44px}button{padding:10px 36px}}
</style>
<style>
#sound-credit{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:.4em;font-size:clamp(16px,2vw,22px);color:#d6dbe3;line-height:1.5}#sound-credit a{color:#ffe098;text-underline-offset:4px}#sound-credit .creator{font-size:1.3em;font-weight:800}#sound-credit a:focus-visible{outline:2px solid #75e8e4}@media(max-height:550px){#sound-credit{font-size:14px}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="なんでもキャノン ゲーム画面"></canvas>
<p id="share-status" role="status" hidden style="position:fixed;bottom:12px;left:5%;right:5%;z-index:10;background:#122331;padding:10px;border:2px solid #ffe098;text-align:center"></p>
<section id="cover" aria-label="ゲームを開始">
  <img class="title" src="logo.webp" alt="なんでもキャノン">
  <img class="scene" src="opening.png" alt="大砲で物を投げ、青いエリアに積み上げる">
  <button id="start" type="button" aria-label="ゲームを開始"><img src="start.webp" alt="はじめる"></button>
  <div id="sound-credit" aria-label="効果音クレジット">効果音：<a class="creator" href="https://otologic.jp/" target="_blank" rel="noopener noreferrer">OtoLogic</a> — <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a><span> / </span><a href="licenses/otologic.txt" target="_blank" rel="noopener noreferrer">素材情報</a></div>
  <progress id="progress" hidden aria-label="読み込み"></progress>
  <p id="message" role="status"></p>
</section>
<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script type="module">
import {installCompressedWasm} from './wasm-loader.mjs';
import {installResultSharing} from './share.mjs';
installResultSharing();
const config = $GODOT_CONFIG;
// Attribution belongs to the start screen. Gameplay uses the full canvas.
config.canvasResizePolicy = 2;
const start = document.querySelector('#start');
const progress = document.querySelector('#progress');
const message = document.querySelector('#message');
let failed = false;
let restore = () => {};
start.addEventListener('click', async () => {
  if (failed) { location.reload(); return; }
  start.disabled = true;
  progress.hidden = false;
  message.textContent = '読み込み中…';
  try {
    const response = await fetch('./runtime.json');
    if (!response.ok) throw new Error('読み込みに失敗しました。');
    const runtime = await response.json();
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = runtime.executable + '.js';
      script.crossOrigin = 'anonymous';
      script.onload = resolve;
      script.onerror = () => reject(new Error('エンジンを読み込めませんでした。'));
      document.head.appendChild(script);
    });
    const missing = Engine.getMissingFeatures({threads: false});
    if (missing.length) throw new Error('WebGL 2を利用できません。ブラウザの設定を確認してください。');
    config.executable = runtime.executable;
    config.mainPack = 'index.pck';
    config.fileSizes[runtime.executable + '.wasm'] = runtime.wasmBytes;
    restore = installCompressedWasm(runtime, document.baseURI);
    const engine = new Engine(config);
    await engine.startGame({ onProgress: (current, total) => {
      if (total > 0) { progress.max = total; progress.value = current; }
      else progress.removeAttribute('value');
    }});
    document.querySelector('#cover').hidden = true;
    document.querySelector('#canvas').focus();
  } catch (error) {
    console.error(error);
    failed = true;
    message.textContent = error.message.startsWith('WebGL') || error.message.startsWith('このブラウザ') ? error.message : '読み込めませんでした。通信を確認して、もう一度タップしてください。';
    progress.hidden = true;
    start.disabled = false;
    start.setAttribute('aria-label', '再読み込み');
  } finally { restore(); }
});
</script>
</body>
</html>
