<noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
<script type="module">
import {installCompressedWasm} from './wasm-loader.mjs';
import {installResultSharing} from './share.mjs';
import {installBGM} from './bgmer-player.mjs';
import {installInputHint} from './input-hint.mjs';
import {installProgressStore} from './progress-store.mjs';
installInputHint();
installResultSharing();
const bgm = installBGM(window);
const config = $GODOT_CONFIG;
const progressStore = installProgressStore(window);
if (progressStore.isLocalStorage()) {
  // PLiCy uses localStorage through the game bridge, never Godot's IDBFS.
  config.persistentPaths = [];
  config.persistentDrops = false;
}
// Attribution belongs to the start screen. Gameplay uses the full canvas.
config.canvasResizePolicy = 2;
const start = document.querySelector('#start');
const progress = document.querySelector('#progress');
const message = document.querySelector('#message');
let failed = false;
let restore = () => {};
start.addEventListener('click', async () => {
  if (failed) { location.reload(); return; }
  bgm.unlock(); // Unlock the gain node in the gesture; the title stays silent.
  start.disabled = true;
  progress.hidden = false;
  message.textContent = '読み込み中…';
  try {
    const response = await fetch('./runtime.json');
    if (!response.ok) throw new Error('読み込みに失敗しました。');
    const runtime = await response.json();
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = runtime.executable + '.js';
      script.crossOrigin = 'anonymous';
      script.onload = resolve;
      script.onerror = () => reject(new Error('エンジンを読み込めませんでした。'));
      document.head.appendChild(script);
    });
    const missing = Engine.getMissingFeatures({threads: false});
    if (missing.length) throw new Error('WebGL 2を利用できません。ブラウザの設定を確認してください。');
    config.executable = runtime.executable;
    config.mainPack = 'index.pck';
    config.fileSizes[runtime.executable + '.wasm'] = runtime.wasmBytes;
    restore = installCompressedWasm(runtime, document.baseURI);
    const engine = new Engine(config);
    await engine.startGame({ onProgress: (current, total) => {
      if (total > 0) { progress.max = total; progress.value = current; }
      else progress.removeAttribute('value');
    }});
    document.querySelector('#cover').hidden = true;
    bgm.startGameplay();
    document.querySelector('#canvas').focus();
  } catch (error) {
    bgm.stopGameplay();
    console.error(error);
    failed = true;
    message.textContent = error.message.startsWith('WebGL') || error.message.startsWith('このブラウザ') ? error.message : '読み込めませんでした。通信を確認して、もう一度タップしてください。';
    progress.hidden = true;
    start.disabled = false;
    start.setAttribute('aria-label', '再読み込み');
  } finally { restore(); }
});
</script>
